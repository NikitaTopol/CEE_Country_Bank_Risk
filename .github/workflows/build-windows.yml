name: Build Windows Application

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas PySide6 PyInstaller

      - name: Build application
        run: |
          pyinstaller --windowed --name "Country Bank Risk Dashboard" --add-data "data;data" desktop_app.py

      - name: Create ZIP
        shell: powershell
        run: |
          Compress-Archive -Path "dist\Country Bank Risk Dashboard" -DestinationPath "Country-Bank-Risk-Dashboard-Windows.zip"

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: Country-Bank-Risk-Dashboard-Windows
          path: Country-Bank-Risk-Dashboard-Windows.zip
